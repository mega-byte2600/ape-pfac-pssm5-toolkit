name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected deployed Git commit prefix
        required: false
        type: string

jobs:
  deployed-site:
    name: Verify deployed public site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for production and run smoke
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            EXPECTED_SHA="${GITHUB_SHA:0:12}"
          fi
          for attempt in $(seq 1 20); do
            echo "Production smoke attempt ${attempt}/20 for ${EXPECTED_SHA}"
            if python scripts/production_smoke.py --expected-sha "$EXPECTED_SHA"; then
              exit 0
            fi
            sleep 15
          done
          echo "Production did not reach a passing state within the verification window."
          exit 1
